<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频告警 · 工程机械伤害检测平台</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v=20261014-visibility1">
</head>
<body class="alarms-page">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div><strong>智能检测平台</strong></div>
      </div>
      <nav class="nav-list" aria-label="主导航">
        <a class="nav-item" href="/channels"><span class="nav-icon">▦</span><span>视频通道</span></a>
        <a class="nav-item" href="/tasks"><span class="nav-icon">▶</span><span>视频任务</span></a>
        <a class="nav-item" href="/preview"><span class="nav-icon">▣</span><span>实时预览</span></a>
        <a class="nav-item active" href="/alarms"><span class="nav-icon">!</span><span>视频告警</span></a>
        <a class="nav-item" href="/manual-reviews"><span class="nav-icon">审</span><span>人工复核</span></a>
        <a class="nav-item" href="/training"><span class="nav-icon">训</span><span>模型训练</span></a>
      </nav>
      <div class="sidebar-footer"><span class="status-dot online"></span><span>Web 服务运行中</span></div>
    </aside>

    <main class="main-content alarm-content">
      <header class="topbar alarm-topbar">
        <div><p class="eyebrow">VIDEO ALARMS</p><h1>视频告警</h1></div>
        <div class="alarm-capacity"><span>本地最大存储</span><strong id="alarm-capacity">2000 条</strong></div>
      </header>

      <section class="alarm-filter-panel" aria-label="告警筛选">
        <label class="alarm-filter-field">
          <span>告警任务</span>
          <select id="alarm-task-filter"><option value="">全部任务</option></select>
        </label>
        <label class="alarm-filter-field">
          <span>视频通道</span>
          <select id="alarm-channel-filter"><option value="">全部通道</option></select>
        </label>
        <label class="alarm-filter-field">
          <span>告警日期</span>
          <input id="alarm-date-filter" type="date">
        </label>
        <label class="alarm-filter-field">
          <span>复核结果</span>
          <select id="alarm-review-filter">
            <option value="">全部结果</option>
            <option value="confirmed">已确认</option>
            <option value="rejected">已拒绝（疑似误报）</option>
            <option value="uncertain">存疑</option>
          </select>
        </label>
        <button class="button primary alarm-query-button" id="alarm-query-button" type="button">查询</button>
        <button class="button secondary" id="alarm-reset-button" type="button">重置</button>
      </section>

      <section class="alarm-visibility-panel" aria-label="告警展示设置">
        <label class="alarm-visibility-control">
          <span class="mini-switch"><input id="alarm-show-unverified" type="checkbox" role="switch" aria-describedby="alarm-visibility-hint"><i aria-hidden="true"></i></span>
          <strong>显示存疑和错误告警</strong>
        </label>
        <span id="alarm-visibility-hint">仅展示复核已确认的告警</span>
      </section>

      <section class="alarm-result-panel">
        <header class="alarm-result-header">
          <div><h2>告警记录</h2><p>左侧色条：已确认绿色、已拒绝红色、存疑橙色</p></div>
          <div class="alarm-result-count">共 <strong id="alarm-total">0</strong> 条</div>
        </header>

        <div class="alarm-card-grid" id="alarm-card-grid">
          <div class="alarm-loading">正在加载告警记录…</div>
        </div>

        <div class="alarm-empty hidden" id="alarm-empty">
          <div class="empty-icon">!</div>
          <h3>暂无视频告警</h3>
          <p>当前展示范围及筛选条件下暂无告警，可调整筛选或开启上方开关查看其他结果。</p>
        </div>

        <footer class="alarm-footer">
          <button class="button danger" id="delete-selected-alarms" type="button" disabled>删除选中 <span id="selected-alarm-count">0</span></button>
          <div class="alarm-pagination">
            <button class="page-button" id="alarm-previous" type="button" aria-label="上一页">‹</button>
            <div class="page-numbers" id="alarm-page-numbers"></div>
            <span class="page-summary" id="alarm-page-summary">第 1 / 1 页</span>
            <button class="page-button" id="alarm-next" type="button" aria-label="下一页">›</button>
          </div>
          <button class="button secondary alarm-clear-button" id="clear-alarms" type="button">清空全部记录</button>
        </footer>
      </section>
    </main>
  </div>

  <div class="modal hidden" id="alarm-image-modal" role="dialog" aria-modal="true" aria-labelledby="alarm-image-title">
    <div class="modal-backdrop" data-close-alarm-image></div>
    <div class="modal-card alarm-image-card">
      <div class="modal-header">
        <div><p class="eyebrow">ALARM IMAGE</p><h2 id="alarm-image-title">告警图片</h2></div>
        <button class="icon-button" type="button" data-close-alarm-image aria-label="关闭">×</button>
      </div>
      <div class="alarm-image-stage"><img id="alarm-image-preview" alt="视频告警大图"></div>
      <div class="modal-footer"><button class="button secondary" type="button" data-close-alarm-image>关闭</button></div>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <script src="{{ url_for('static', path='/alarms.js') }}?v=20261014-visibility1" defer></script>
</body>
</html>
